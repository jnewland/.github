name: update branch
on:
  workflow_call:
    inputs:
      pull_number:
        description: PR to update
        required: true
        type: number
    secrets:
      token:
        required: true
  pull_request:
    paths:
      - .github/workflows/update-branch.yaml
jobs:
  update-branch:
    runs-on: ubuntu-latest
    steps:
      - name: update branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PULL_NUMBER: ${{ inputs.pull_number || github.event.pull_request.number }}
          REF: heads/${{ github.event.repository.default_branch }}
        with:
          github-token: ${{ secrets.token || github.token }}
          script: |
            const pullNumber = parseInt(process.env.PULL_NUMBER, 10)
            const defaultBranchRef = await github.rest.git.getRef({
              ...context.repo,
              ref: process.env.REF
            })
            const defaultBranchSha = defaultBranchRef.data.object.sha

            const deadline = Date.now() + 30_000
            let mergeable_state, base, head
            while (true) {
              ;({ mergeable_state, base, head } = (await github.rest.pulls.get({
                ...context.repo,
                pull_number: pullNumber
              })).data)
              const needsUpdate = mergeable_state === 'behind' || defaultBranchSha !== base.sha
              console.log(`PR #${pullNumber}: mergeable_state=${mergeable_state}, base.sha=${base.sha}, default_branch.sha=${defaultBranchSha}`)
              if (!['unknown', 'unstable'].includes(mergeable_state) || !needsUpdate) break
              if (Date.now() >= deadline) {
                console.log(`PR #${pullNumber} mergeable_state still ${mergeable_state} after 30s, proceeding anyway`)
                break
              }
              console.log(`PR #${pullNumber} mergeable_state is ${mergeable_state}, retrying...`)
              await new Promise(r => setTimeout(r, 3_000))
            }

            if (mergeable_state === 'behind' || defaultBranchSha !== base.sha) {
              console.log(`Updating PR #${pullNumber} branch`)
              const result = await github.rest.pulls.updateBranch({
                ...context.repo,
                pull_number: pullNumber,
                expected_head_sha: head.sha
              })
              console.log(`Update result: ${result.data.message}`)
              throw 'updated branch'
            }
            console.log(`PR #${pullNumber} is up to date, no update needed`)
